services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasknova
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  api:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./server:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tasknova
      JWT_SECRET: development-secret-replace-in-production
    depends_on: [postgres]
